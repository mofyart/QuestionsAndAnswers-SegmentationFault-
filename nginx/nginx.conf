# Определяем upstream для нашего Django-приложения.
# 'web' — это имя сервиса Gunicorn из docker-compose.yml, 8000 — его порт.
# proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_cache:10m max_size=100m inactive=60m;


upstream django_app {
    server web:8000;
}

server {
    listen 80;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;


    location /static/ {
        alias /app/staticfiles/;

        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /app/media/;

        expires 30d;
        add_header Cache-Control "public";
    }

    # Кэширование странцы, которую отдаёт Appserver на Nginx
    # location /ajax/vote/ {
    #     proxy_pass http://django_app;
    #     proxy_cache off;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header Host $host;
    # }

    # location /ajax/correct/ {
    #     proxy_pass http://django_app;
    #     proxy_cache off;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header Host $host;
    # }

    location / {
        proxy_pass http://django_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;

        # proxy_cache my_cache;
        # proxy_cache_valid 200 1m;
        # proxy_cache_valid 404 1m;

        # add_header X-Cache-Status $upstream_cache_status;
    }
}
