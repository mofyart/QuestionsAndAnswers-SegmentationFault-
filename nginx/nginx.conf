# Определяем upstream для нашего Django-приложения.
# 'web' — это имя сервиса Gunicorn из docker-compose.yml, 8000 — его порт.
upstream django_app {
    server web:8000;
}

server {
    listen 80;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://django_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}
