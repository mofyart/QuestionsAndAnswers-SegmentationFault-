services:
  db:
    image: postgres:15-alpine
    container_name: segmentationfault_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}

  redis:
    image: redis:7-alpine
    container_name: segmentationfault_redis
    ports:
       - "6379:6379"

  web:
    build: .
    container_name: segmentationfault_web
    command: >
      sh -c "python manage.py collectstatic --no-input && 
             gunicorn SegmentationFault.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles 
    depends_on:
      - db
      - redis
    env_file:
      - .env

  celery:
    build: .
    container_name: segmentationfault_celery
    command: celery -A SegmentationFault worker --beat --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
      - web
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_HOST=db 

  nginx:
    image: nginx:1.25-alpine
    container_name: segmentationfault_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf 
      - static_volume:/app/staticfiles 
      - ./app/media:/app/media
    ports:
      - "80:80"
    depends_on:
      - web

  centrifugo:
    container_name: centrifugo
    image: centrifugo/centrifugo:v6
    volumes:
      - ./centrifugo.json:/centrifugo/config.json
    command: centrifugo -c config.json
    # env_file:
    #   - .env
    # environment:
    #   - CENTRIFUGO_API_KEY=${CENTRIFUGO_API_KEY}
    #   - CENTRIFUGO_TOKEN_HMAC_SECRET_KEY=${CENTRIFUGO_HMAC_SECRET_KEY}
    #   - CENTRIFUGO_ADMIN_PASSWORD=${CENTRIFUGO_ADMIN_PASSWORD}
    #   - CENTRIFUGO_ADMIN_SECRET=${CENTRIFUGO_ADMIN_SECRET}
    ports:
      - 8000:8000
      - 8001:8001
    ulimits:
      nofile:
        soft: 65535
        hard: 65535


volumes:
  postgres_data:
  static_volume:
