{% load static %}

<article class="question-full-item">
    <div class="question-meta">
        <div class="avatar-question">
            {% if q.user.avatar %}
                <img src="{{ q.user.avatar.url }}">
            {% else %}
                <img src="{% static 'main/default.jpg' %}">
            {% endif %}
        </div>

        <div class="vote-controls">
            <button class="js-vote-btn upvote {% if q.user_vote == 1 %}active{% endif %}"
                    data-id="{{ q.id }}"
                    data-type="question"
                    data-action="like">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="18 15 12 9 6 15"></polyline>
                    </svg>
            </button>

            <div class="vote-count" id="rating-question-{{ q.id }}">{{ q.likes_count }}</div>

            <button class="js-vote-btn downvote {% if q.user_vote == -1 %}active{% endif %}"
                    data-id="{{ q.id }}"
                    data-type="question"
                    data-action="dislike">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
            </button>
        </div>
    </div>
    <div class="question-details">
        <div class="question-title">
            <a href="{% url 'question' q.id %}">{{ q.title }}</a>
        </div>
        <p class="question-full-body">
            {{ q.text }}
        </p>
        <div class="question-footer">
            {% if tagPage %}
            {% else %}
                <div class="tags">
                    Tags:

                    {% for tag in q.tags.all %}
                        <a href="{% url 'tag' tag.id %}" class="tag">{{ tag.name }}</a>
                    {% endfor %}
                </div>
            {% endif %}
        </div>
    </div>
</article>
