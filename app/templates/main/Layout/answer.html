<article class="answer-item correct-answer">
    <div class="question-meta">
        <div class="avatar-question">
            <img src="{{ answer.user.profile.avatar.url }}" alt="Avatar" style="width: 50px; height: 50px;">
        </div>
        <div class="vote-controls">
            <span>▲</span>
            <div class="vote-count">{{ answer.likes_count }}</div>
            <span>▼</span>
        </div>
    </div>

    <div class="answer-details">
        <div class="answer-username">{{ answer.user.nick_name }}</div>
        <p>{{ answer.text }}</p>

        {% if answer.is_correct %}
            <div class="correct-marker">
                <input type="checkbox" id="correct-{{ answer.id }}" checked disabled>
                <label for="correct-{{ answer.id }}">Correct!</label>
            </div>
        {% endif %}
    </div>
</article>
