{% load static %}
<article class="answer-item {% if answer.is_correct %} correct-answer {% endif %}" id="answer-{{ answer.id }}">
    <div class="question-meta">
        <div class="avatar-question">
            {% if answer.user.avatar %}
                <img src="{{ answer.user.avatar.url }}">
            {% else %}
                <img src="{% static 'main/default.jpg' %}">
            {% endif %}
        </div>

        <div class="vote-controls">
            <button class="js-vote-btn upvote {% if answer.user_vote == 1 %}active{% endif %}"
                    data-id="{{ answer.id }}"
                    data-type="answer"
                    data-action="like">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="18 15 12 9 6 15"></polyline>
                    </svg>
            </button>

            <div class="vote-count" id="rating-answer-{{ answer.id }}">{{ answer.likes_count }}</div>

            <button class="js-vote-btn downvote {% if answer.user_vote == -1 %}active{% endif %}"
                    data-id="{{ answer.id }}"
                    data-type="answer"
                    data-action="dislike">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
            </button>
        </div>
    </div>

    <div class="answer-details">
        <div class="answer-username">{{ answer.user.nick_name }}</div>
        <p>{{ answer.text }}</p>

        <div class="correct-marker">
            <input type="checkbox"
                class="js-correct-btn"
                id="correct-{{ answer.id }}"
                data-answer-id="{{ answer.id }}"
                {% if answer.is_correct %}checked{% endif %}
                {% if request.user != question.user.user %}disabled{% endif %}>

            <label for="correct-{{ answer.id }}">Correct!</label>
        </div>
    </div>
</article>
